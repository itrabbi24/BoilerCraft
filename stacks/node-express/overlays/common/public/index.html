<!DOCTYPE html>
<html lang="en" data-theme="{{COLOR_MODE}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{APP_TITLE}}</title>
  <link rel="stylesheet" href="/theme.css">
  {{STYLESHEET_LINK}}
</head>
<body class="p-6">
  <div style="max-width: 850px; margin: 2rem auto; text-align: center;">
    {{LOGO_HTML}}
    <h1>{{APP_TITLE}}</h1>
    <p style="color: var(--color-text-muted);">{{APP_DESC}}</p>

    <div style="text-align: left; padding: 2rem; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-base); margin-top: 2rem;">
      <h3>Active Architecture:</h3>
      <ul>
        <li><strong>Backend:</strong> Node.js + Express {{VERSION}}.x</li>
        <li><strong>Database:</strong> {{DATABASE}}</li>
        <li><strong>Styling:</strong> {{STYLING}}</li>
      </ul>
      <p>Health API: <a href="/api/health">/api/health</a></p>
      <hr style="border: none; border-top: 1px solid var(--color-border); margin: 1.5rem 0;" />
      <h4>Components:</h4>
      {{UI_COMPONENTS}}
    </div>
  </div>
  <script src="/theme.js"></script>
</body>
</html>
