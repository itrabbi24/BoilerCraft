name: Publish CLI to npm

# Push a tag like v1.1.0 (matching package.json "version") to publish
# `npx boilercraft`. Requires an NPM_TOKEN repository secret
# (npmjs.com → Access Tokens → Granular, publish rights for "boilercraft").
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - run: npm test
      - run: node bin/boilercraft.js --help
      - run: node bin/boilercraft.js new ci-app -s node-express -d mongodb -y -o ${{ runner.temp }}
      - run: node bin/boilercraft.js list

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci --omit=dev
      - run: npm test
      # Without an NPM_TOKEN secret, skip instead of failing: publish by hand
      # with `npm publish` (npm asks for 2FA in the browser).
      - name: Check for NPM_TOKEN
        id: token
        run: echo "present=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present != 'true'
        run: echo "::notice::NPM_TOKEN secret not set, skipping npm publish. Run npm publish locally."
      - if: steps.token.outputs.present == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
